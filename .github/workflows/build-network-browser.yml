name: Build Paradise Network Browser

on:
  push:
    paths:
      - "network-browser/**"
      - ".github/workflows/build-network-browser.yml"
  pull_request:
    paths:
      - "network-browser/**"
      - ".github/workflows/build-network-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build
        run: dotnet build .\network-browser\ParadiseNetworkBrowser.csproj --configuration Release
      - name: Publish self-contained Windows x64 app
        run: dotnet publish .\network-browser\ParadiseNetworkBrowser.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o .\artifacts\network-browser
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ParadiseNetworkBrowser-win-x64
          path: artifacts/network-browser/
